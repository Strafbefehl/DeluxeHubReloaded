name: Build All Branches and Generate Artifacts

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The version number for artifact naming (e.g., 1.0.0)'
        required: true

jobs:
  build-artifacts:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'  # Use the Eclipse Temurin distribution
        java-version: '21'

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for all branches

    - name: Get all branches
      run: |
        git fetch --all
        git branch -r | grep -v '\->' | sed 's/origin\///' > branches.txt
      shell: bash

    - name: Compile and Package Each Branch
      run: |
        mkdir -p artifacts
        while IFS= read -r branch
        do
          echo "Processing branch: $branch"
          git checkout $branch
          mvn clean package -DskipTests
          mkdir -p artifacts/$branch
          cp target/*.jar artifacts/$branch/ 2>/dev/null || echo "No JAR found for branch $branch"
        done < branches.txt
      shell: bash

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DeluxeHub-Builds-v${{ github.event.inputs.release_version }}
        path: artifacts/
        retention-days: 14  # Keep artifacts for 14 days
